# Batch 2: same physics as sim_config.yaml, but with a realistic class imbalance
# (10% lenses / 90% non-lenses) and a fresh random seed so it's an independent draw.

seed: 123

cosmology:
  H0: 70.0        # km/s/Mpc
  Om0: 0.3

image:
  num_pix: 100           # pixels per side (fixed across all batches for consistent scale)
  pixel_scale: 0.1       # arcsec/pixel (Euclid VIS-like)
  psf_fwhm: 0.18         # arcsec, Gaussian PSF FWHM
  exposure_time: 1800.0  # seconds
  sky_brightness: 22.5   # mag/arcsec^2
  read_noise: 4.0
  ccd_gain: 2.5
  magnitude_zero_point: 25.0
  # Must match sim_config.yaml exactly (same physical setup) so the calibrated
  # scale -- and therefore pixel values -- are identical across batches.
  scale_low: -0.01850
  scale_high: 0.87001

lens_galaxy:
  z_range: [0.2, 0.8]
  velocity_dispersion_range: [150.0, 300.0]  # km/s
  ellipticity_range: [0.0, 0.4]              # |e|, random position angle
  light_magnitude_range: [19.0, 21.5]
  light_r_eff_range: [0.4, 1.2]              # arcsec
  light_sersic_n_range: [3.0, 5.0]
  external_shear_range: [0.0, 0.05]

source_galaxy:
  z_range: [1.0, 3.0]
  magnitude_range: [23.0, 26.0]
  r_eff_range: [0.05, 0.3]        # arcsec
  sersic_n_range: [0.5, 4.0]
  ellipticity_range: [0.0, 0.5]
  offset_range: [-0.35, 0.35]     # arcsec, source center offset from lens center

dataset:
  n_lens: 80          # 10% of 800
  n_nonlens: 720       # 90% of 800
  train_fraction: 0.8

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  device: auto   # auto | cpu | mps | cuda

deepdream:
  octaves: 3
  octave_scale: 1.4
  iterations_per_octave: 40
  learning_rate: 0.08

zoobot:
  encoder_name: "hf_hub:mwalmsley/zoobot-encoder-convnext_nano"
  input_size: 224
